services:
  gdrive-sync:
    build: .
    container_name: gdrive-sync
    # The entrypoint parks itself on unrecoverable errors rather than exiting,
    # so a restart here means a genuine crash. `unless-stopped` would turn the
    # circuit breaker into a restart loop, since the failure count is persisted.
    restart: on-failure:3
    # Give an in-flight bisync time to close out cleanly on `docker stop`;
    # a SIGKILL mid-run is what leaves the state dir needing a resync.
    stop_grace_period: 120s
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: /scripts/entrypoint.sh
    environment:
      - TZ=${TZ:-UTC}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-5}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - MAX_FAILURES=${MAX_FAILURES:-10}
      - MAX_BACKOFF_MINUTES=${MAX_BACKOFF_MINUTES:-60}
      - MAX_DELETE_PERCENT=${MAX_DELETE_PERCENT:-90}
      - CHECK_ACCESS=${CHECK_ACCESS:-true}
      - CHECK_FILENAME=${CHECK_FILENAME:-RCLONE_TEST}
      - BACKUP_DIR=${BACKUP_DIR:-}
      - SYNC_VERBOSE=${SYNC_VERBOSE:-false}
      - XDG_CACHE_HOME=/cache
    volumes:
      # rclone config directory (needs write access for temp files and token refresh)
      - ./config/rclone:/config/rclone
      # Exclude patterns
      - ./config/excludes.txt:/config/excludes.txt:ro
      # Scripts
      - ./scripts/entrypoint.sh:/scripts/entrypoint.sh:ro
      - ./scripts/sync.sh:/scripts/sync.sh:ro
      # Google Drive sync folder (host path from LOCAL_PATH)
      - ${LOCAL_PATH}:/data
      # Persistent bisync state (tracks file changes between runs)
      - ./data/bisync:/cache/rclone/bisync
      # Only if you set BACKUP_DIR=/backup (see .env.template) -- unnecessary
      # when the local folder is already snapshotted:
      # - ./data/backup:/backup
